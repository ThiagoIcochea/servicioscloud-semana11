name: Laboratorio Escalabilidad y Elasticidad

# Servicios Cloud (UTP) — Semana 11
# Autor: Thiago Paolo Icochea Rodriguez (U22330428)
#
# Cada combinación patrón × estrategia corre en su propio runner efímero
# (ubuntu-latest, 4 vCPU), que GitHub destruye al terminar: los recursos de
# laboratorio quedan eliminados automáticamente.

on:
  workflow_dispatch:
    inputs:
      k:
        description: "Capacidad de referencia K (sol/s de 1 réplica de 0,5 vCPU). Vacío = usar la calibración"
        required: false
        default: ""
      solo_calibracion:
        description: "Ejecutar solo la calibración"
        type: boolean
        default: false
      publicar:
        description: "Publicar resultados en la carpeta results/ del repositorio"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: laboratorio
  cancel-in-progress: false

jobs:
  calibracion:
    name: Calibración (1 réplica × 0,5 vCPU)
    runs-on: ubuntu-latest
    outputs:
      k: ${{ steps.k.outputs.k }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Escalones de carga 5→40 sol/s
        run: bash scripts/run_experiment.sh CALIB fijo 30 results/raw/CALIB_fijo
      - name: Calcular K
        id: k
        run: |
          pip install --quiet pandas
          python3 analysis/calibrate.py results/raw/CALIB_fijo | tee results/raw/CALIB_fijo/calibration.txt
          K="${{ inputs.k }}"
          if [ -z "$K" ]; then K=$(grep '^K=' results/raw/CALIB_fijo/calibration.txt | cut -d= -f2); fi
          echo "k=$K" >> "$GITHUB_OUTPUT"
          echo "### Calibración: K = $K sol/s" >> "$GITHUB_STEP_SUMMARY"
          cat results/raw/CALIB_fijo/calibration.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-CALIB_fijo
          path: results/raw/CALIB_fijo

  experimento:
    # Todas las estrategias de un patrón corren en el MISMO runner (mismo hardware),
    # de modo que la comparación entre estrategias no se contamina por la
    # variación de CPU entre runners. Cada patrón se repite 2 veces.
    name: Patrón ${{ matrix.patron }} · repetición ${{ matrix.rep }}
    needs: calibracion
    if: ${{ !inputs.solo_calibracion }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        patron: [A, B, C, D]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Info del runner
        run: |
          nproc; free -h; lscpu | grep -E "Model name|^CPU\(s\)"; docker version --format '{{.Server.Version}}'
      - name: Ejecutar estrategias
        env:
          REP: ${{ matrix.rep }}
        run: |
          ESTR="fijo vertical horizontal elastico elastico_mejorado"
          [ "${{ matrix.patron }}" = "C" ] && ESTR="$ESTR programado"
          for e in $ESTR; do
            bash scripts/run_experiment.sh ${{ matrix.patron }} $e ${{ needs.calibracion.outputs.k }} \
              results/raw/r${{ matrix.rep }}/${{ matrix.patron }}_$e
            echo "### ${{ matrix.patron }} · $e · rep ${{ matrix.rep }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat results/raw/r${{ matrix.rep }}/${{ matrix.patron }}_$e/autoscaler.log >> "$GITHUB_STEP_SUMMARY" || true
            grep -E "http_req_duration|http_req_failed|dropped" results/raw/r${{ matrix.rep }}/${{ matrix.patron }}_$e/k6.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: raw-r${{ matrix.rep }}-${{ matrix.patron }}
          path: results/raw/r${{ matrix.rep }}/${{ matrix.patron }}_*

  analisis:
    name: Análisis y gráficos
    needs: [calibracion, experimento]
    if: ${{ always() && needs.calibracion.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: dl
      - name: Ordenar artefactos
        run: |
          rm -rf results/raw && mkdir -p results/raw/r1 results/raw/r2
          mv dl/raw-CALIB_fijo results/raw/CALIB_fijo
          # Solo se copian las carpetas del patrón propio de cada artefacto
          for d in dl/raw-r*; do n=$(basename "$d"); r=$(echo "$n" | cut -d- -f2); p=$(echo "$n" | cut -d- -f3)
            find "$d" -maxdepth 3 -type d -name "${p}_*" -exec cp -r {} "results/raw/$r/" \; ; done
          ls -R results/raw | head -50
      - name: Analizar
        run: |
          python3 analysis/analyze.py results/raw results
          cat results/resumen.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-laboratorio
          path: results
      - name: Publicar resultados en el repositorio
        if: ${{ inputs.publicar }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Resultados del laboratorio (run ${{ github.run_number }}, K=${{ needs.calibracion.outputs.k }})" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
