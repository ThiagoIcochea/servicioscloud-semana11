# Arquitectura del laboratorio: Nginx (LB) -> N réplicas de "web"
# Las variables CPUS / WORKERS permiten probar escalado vertical;
# el número de réplicas (--scale web=N) permite escalado horizontal.
services:
  web:
    build: ./app
    image: shoplab-web:latest
    environment:
      WORKERS: ${WORKERS:-2}
      WARMUP_SECONDS: ${WARMUP_SECONDS:-10}
      WORK_ITERATIONS: ${WORK_ITERATIONS:-12000}
    cpus: ${CPUS:-0.5}
    mem_limit: 256m
    labels:
      lab.role: "web"

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
