# Balanceador de carga (equivalente a un Load Balancer cloud)
# Descubre dinámicamente las réplicas del servicio "web" vía el DNS de Docker,
# de modo que las instancias agregadas/retiradas por el autoescalador entran y
# salen del pool sin reiniciar el balanceador.
worker_processes 1;
events { worker_connections 4096; }

http {
    access_log off;
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 80;
        location = /lb-health { return 200 "ok\n"; }
        location / {
            set $backend web;
            proxy_pass http://$backend:8000;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
        }
    }
}
